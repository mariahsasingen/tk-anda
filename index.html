<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOKO ANDA - Sistem Stok Barang</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --kertas:#EEF2F6; --permukaan:#FFFFFF; --permukaan-2:#F6F8FB;
  --tinta:#14283D; --tinta-2:#51667A;
  --garis:#DAE2EA; --garis-tebal:#AEBCCB;
  --kuning:#A6192E; --kuning-tinta:#FFFFFF; --kuning-lembut:#FBE1E4;
  --masuk:#12764A; --masuk-bg:#DFF2E7;
  --keluar:#B92E25; --keluar-bg:#FBE4E1;
  --bahaya:#C0382D;
  --kepala-bg:#14283D; --kepala-tinta:#FFFFFF; --kepala-samar:#9FB2C6;
  --fokus:#1D5FD1;
  --bayangan:0 1px 2px rgba(20,40,61,.08),0 10px 30px rgba(20,40,61,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --kertas:#0E1720; --permukaan:#16232F; --permukaan-2:#1B2B3A;
    --tinta:#E7EEF5; --tinta-2:#9DB0C2;
    --garis:#263847; --garis-tebal:#3C5265;
    --kuning-lembut:#3A1620;
    --masuk:#5BD69B; --masuk-bg:#12382A;
    --keluar:#FF8C80; --keluar-bg:#43201D;
    --kepala-bg:#0A1119; --kepala-samar:#7F93A6;
    --fokus:#7FB0FF;
    --bayangan:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --kertas:#0E1720; --permukaan:#16232F; --permukaan-2:#1B2B3A;
  --tinta:#E7EEF5; --tinta-2:#9DB0C2;
  --garis:#263847; --garis-tebal:#3C5265;
  --kuning-lembut:#3A1620;
  --masuk:#5BD69B; --masuk-bg:#12382A;
  --keluar:#FF8C80; --keluar-bg:#43201D;
  --kepala-bg:#0A1119; --kepala-samar:#7F93A6;
  --fokus:#7FB0FF;
  --bayangan:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--kertas);color:var(--tinta);min-height:100vh;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
body:has(dialog[open]){overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}

/* ---------- Tombol ---------- */
.tombol{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;white-space:nowrap}
.tombol.utama{background:var(--kuning);color:var(--kuning-tinta)}
.tombol.utama:hover{filter:brightness(.95)}
.tombol.sekunder{border-color:var(--garis-tebal);color:var(--tinta)}
.tombol.sekunder:hover{background:var(--permukaan-2)}
.tombol.bahaya{background:var(--bahaya);color:#fff}
.tombol[disabled],.btn-sel[disabled],.bulan-nav button[disabled]{opacity:.4;cursor:not-allowed}
.btn-sel{min-height:38px;padding:0 14px;border-radius:8px;border:1.5px solid var(--garis-tebal);background:transparent;font-weight:600;cursor:pointer}
.btn-sel:hover{background:var(--permukaan-2)}
.btn-sel.plus{min-width:46px;font-size:20px;line-height:1;padding:0}
.btn-sel.hapus{color:var(--keluar);border-color:var(--keluar)}
.btn-teks{background:none;border:0;padding:6px 8px;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-teks.merah{color:var(--keluar)}
.tutup{width:44px;height:44px;flex:none;border-radius:10px;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;color:var(--tinta-2)}
.tutup:hover{background:var(--permukaan-2)}

/* ---------- Layar masuk ---------- */
.masuk-layar{min-height:100dvh;display:grid;place-items:center;padding:24px}
.kartu-masuk{width:min(380px,100%);background:var(--permukaan);border:1px solid var(--garis);border-radius:18px;padding:34px 24px 24px;text-align:center;box-shadow:var(--bayangan)}
.merek-besar{display:flex;align-items:center;justify-content:center;gap:12px;font-size:28px;font-weight:800;letter-spacing:.01em}
.kartu-masuk .sub{margin-top:6px}
.pin-host{margin:26px 0 8px}
.pin{display:flex;justify-content:center;gap:12px}
.pin-kotak{width:56px;height:66px;border-radius:12px;border:2px solid var(--garis-tebal);background:var(--permukaan);text-align:center;font-size:28px;font-weight:700;padding:0}
.pin-kotak:not(:placeholder-shown){border-color:var(--tinta)}
.pin.salah .pin-kotak{border-color:var(--keluar)}
@media (prefers-reduced-motion:no-preference){.pin.salah{animation:geser .35s}}
@keyframes geser{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pesan-pin{min-height:24px;color:var(--keluar);font-weight:600;font-size:15px}
.lupa{margin-top:10px;color:var(--tinta-2);font-size:14px}

/* ---------- Kepala & navigasi ---------- */
.atas{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--kepala-bg);color:var(--kepala-tinta)}
.atas-dalam,.tab{max-width:1080px;margin:0 auto;padding:0 20px}
.atas-dalam{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:4px}
.merek{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.atas-aksi{display:flex;gap:4px}
.atas-aksi .btn-teks{color:var(--kepala-tinta);text-decoration:none;min-height:40px;padding:0 12px;white-space:nowrap}
.atas-aksi .btn-teks:hover{background:rgba(255,255,255,.1)}
.tab{display:flex;gap:4px;overflow-x:auto}
.tab a,.tab button{background:none;border:0;color:var(--kepala-samar);padding:10px 14px 12px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;text-decoration:none}
.tab .aktif{color:var(--kepala-tinta);border-bottom-color:var(--kuning)}
.tab button{cursor:not-allowed}
.tab small{font-weight:500;margin-left:4px;opacity:.8}

@media (max-width:420px){
  .atas-dalam,.tab,.konten{padding-left:14px;padding-right:14px}
  .merek{font-size:16px;gap:8px}
  .merek svg{width:24px;height:24px}
  .atas-aksi{gap:0}
  .atas-aksi .btn-teks{padding:0 8px;font-size:14px}
}
@media (max-width:340px){.merek svg{display:none}}
/* ---------- Halaman utama ---------- */
.konten{max-width:1080px;margin:0 auto;padding:24px 20px 56px}
.judul-baris{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--tinta-2);font-size:15px}
.aksi-utama{display:flex;gap:10px;flex-wrap:wrap}
.cari{display:flex;align-items:center;gap:14px;margin:20px 0 14px}
.cari input{flex:1;min-width:0;min-height:46px;border-radius:10px;border:1.5px solid var(--garis-tebal);background:var(--permukaan);padding:0 14px}
.jumlah{color:var(--tinta-2);font-size:14px;white-space:nowrap}
.spanduk{background:var(--kuning-lembut);border:1px solid var(--kuning);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}

.tabel-bungkus{background:var(--permukaan);border:1px solid var(--garis);border-radius:14px;overflow-x:auto;box-shadow:var(--bayangan)}
table.tabel{width:100%;border-collapse:collapse}
.tabel th{text-align:left;font-size:13px;font-weight:600;color:var(--tinta-2);padding:12px 16px;border-bottom:1px solid var(--garis-tebal);background:var(--permukaan-2);white-space:nowrap}
.tabel td{padding:12px 16px;border-bottom:1px solid var(--garis);vertical-align:middle}
.tabel tbody tr:last-child td{border-bottom:0}
.tabel .angka{text-align:right}
.tabel td.total{font-weight:800;font-size:18px}
.nama{font-weight:700}
.kode{display:block;font-size:13px;color:var(--tinta-2);font-weight:400}
.kosong{background:var(--permukaan);border:1.5px dashed var(--garis-tebal);border-radius:14px;padding:44px 24px;text-align:center}
.kosong h2{font-size:20px;margin-bottom:6px}
.kosong .aksi-utama{justify-content:center;margin-top:18px}

@media (max-width:719px){
  h1{font-size:26px}
  .tabel-bungkus{background:transparent;border:0;box-shadow:none;overflow:visible}
  table.tabel,.tabel tbody,.tabel tr,.tabel td{display:block}
  .tabel thead{position:absolute;left:-9999px}
  .tabel tr{display:grid;grid-template-columns:repeat(3,1fr);gap:0 10px;background:var(--permukaan);border:1px solid var(--garis);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--bayangan)}
  .tabel td{border:0;padding:0}
  .tabel td:first-child{grid-column:1/-1;margin-bottom:10px;font-size:17px}
  .tabel td[data-label]:not(.aksi-sel)::before{content:attr(data-label);display:block;font-size:12px;color:var(--tinta-2);font-weight:500}
  .tabel .angka{text-align:left}
  .tabel td.aksi-sel{margin-top:14px}
  .tabel td.aksi-sel .btn-sel{width:100%}
  .cari{flex-wrap:wrap;gap:6px}
  .aksi-utama{width:100%}
  .aksi-utama .tombol{flex:1}
}

/* ---------- Dialog ---------- */
dialog.dlg{border:0;padding:0;border-radius:16px;background:var(--permukaan);color:var(--tinta);
  width:min(560px,calc(100vw - 24px));max-width:none;max-height:min(92dvh,900px);box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
dialog.dlg::backdrop{background:rgba(8,16,26,.6)}
dialog.dlg.buku{width:min(800px,calc(100vw - 24px));height:min(88dvh,820px)}
dialog.dlg.konfirm{width:min(420px,calc(100vw - 24px))}
dialog.dlg .isi{display:flex;flex-direction:column;max-height:inherit;height:100%;min-height:0;overflow:auto}
dialog.dlg.buku .isi{overflow:hidden}
@media (prefers-reduced-motion:no-preference){dialog.dlg[open]{animation:muncul .18s ease-out}}
@keyframes muncul{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  dialog.dlg.buku{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  dialog.dlg.form{width:100vw;max-width:100vw;margin:auto 0 0 0;border-radius:16px 16px 0 0;max-height:94dvh}
  dialog.dlg .isi{padding-bottom:env(safe-area-inset-bottom,0px)}
}

.form{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.f-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.f-kepala h2{font-size:21px;line-height:1.25;font-weight:800}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.form label small{font-weight:400;color:var(--tinta-2);font-size:13px}
.form input,.form textarea{width:100%;min-height:46px;border-radius:10px;border:1.5px solid var(--garis-tebal);background:var(--permukaan);padding:9px 12px;font-weight:400}
.form textarea{resize:vertical;min-height:80px}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-masuk{color:var(--masuk)} .f-masuk input{border-color:var(--masuk)}
.f-keluar{color:var(--keluar)} .f-keluar input{border-color:var(--keluar)}
.petunjuk{font-size:13px;color:var(--tinta-2);margin-top:-6px}
.galat,.sukses{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.galat{background:var(--keluar-bg);color:var(--keluar)}
.sukses{background:var(--masuk-bg);color:var(--masuk)}
.f-aksi{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:4px}
.konf{padding:22px 22px 20px}
.konf h2{font-size:20px;font-weight:800;margin-bottom:8px}
.konf p{color:var(--tinta-2)}
.konf .f-aksi{margin-top:20px}
.info{display:grid;gap:8px;margin:0;padding:12px 14px;background:var(--permukaan-2);border:1px solid var(--garis);border-radius:10px}
.info div{display:flex;justify-content:space-between;gap:12px}
.info dt{color:var(--tinta-2);font-size:14px} .info dd{margin:0;font-weight:700;text-align:right}
.tanda{display:flex;gap:8px}
.tanda button{width:46px;flex:none;border-radius:10px;border:1.5px solid;background:transparent;font-size:22px;font-weight:700;cursor:pointer}
.tanda .masuk{color:var(--masuk);border-color:var(--masuk)} .tanda .keluar{color:var(--keluar);border-color:var(--keluar)}
.bagian{padding:16px 0;border-top:1px solid var(--garis);display:flex;flex-direction:column;gap:10px}
.bagian:first-of-type{border-top:0;padding-top:0}
.bagian h3{font-size:16px;font-weight:800}
.baris-tombol{display:flex;gap:10px;flex-wrap:wrap}
.berkas{position:relative;cursor:pointer}
.berkas input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.berkas:focus-within{outline:3px solid var(--fokus);outline-offset:2px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
details textarea{margin:8px 0}
.daftar-hapus{display:grid;gap:8px}
.daftar-hapus div{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--garis);border-radius:10px}

/* ---------- Buku rincian ---------- */
.r-kepala{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 16px 6px 20px}
.r-kepala h2{font-size:22px;font-weight:800;line-height:1.25}
.r-info{display:flex;gap:16px;flex-wrap:wrap;color:var(--tinta-2);font-size:14px;margin-top:2px}
.r-alat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px;flex-wrap:wrap}
.bulan-nav{display:flex;align-items:center;gap:6px}
.bulan-nav strong{min-width:150px;text-align:center;font-size:17px}
.bulan-nav button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--garis-tebal);background:transparent;font-size:22px;cursor:pointer}
.r-cari{padding:4px 20px 12px}
.r-cari input{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--garis-tebal);background:var(--permukaan);padding:0 14px}
.buku-kotak{flex:1;min-height:0;display:flex;flex-direction:column;margin:0 20px;border:1px solid var(--garis-tebal);border-radius:12px;overflow:hidden}
.buku-atas,.buku-bawah{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 14px;background:var(--kuning-lembut);font-weight:700}
.buku-atas{border-bottom:1px solid var(--garis-tebal)}
.buku-bawah{border-top:1px solid var(--garis-tebal);font-size:18px;box-shadow:inset 0 -5px 0 -2px var(--permukaan),inset 0 -6px 0 -2px var(--tinta)}
.buku-atas b{font-weight:800}
.nilai{font-size:20px;font-weight:800}
.nilai small{font-size:13px;font-weight:500;color:var(--tinta-2)}
.buku-isi{flex:1;min-height:0;overflow-y:auto}
.baris{display:grid;grid-template-columns:112px 150px 1fr 64px 72px;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--garis)}
.baris.kepala{position:sticky;top:0;background:var(--permukaan-2);font-size:13px;font-weight:600;color:var(--tinta-2);z-index:1}
.baris.dihapus{opacity:.6}
.baris.dihapus .qty{text-decoration:line-through}
.qty{display:inline-flex;min-width:68px;justify-content:center;padding:3px 12px;border-radius:999px;font-weight:800}
.qty.masuk{color:var(--masuk);background:var(--masuk-bg)}
.qty.keluar{color:var(--keluar);background:var(--keluar-bg)}
.k-cat{color:var(--tinta-2);overflow-wrap:anywhere}
.k-aksi2{grid-column:span 2;text-align:right}
.kosong-kecil{padding:28px 16px;text-align:center;color:var(--tinta-2)}
.r-kaki{padding:10px 20px 14px}
.cek{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--tinta-2);cursor:pointer}
.cek input{width:18px;height:18px}
@media (max-width:640px){
  .baris{grid-template-columns:1fr auto auto auto}
  .baris.kepala{display:none}
  .baris .k-tgl{grid-column:1;font-weight:600}
  .baris .k-qty{grid-column:2}
  .baris .k-edit{grid-column:3} .baris .k-hapus{grid-column:4}
  .baris .k-cat{grid-column:1/-1;grid-row:2;font-size:14px}
  .baris .k-aksi2{grid-column:3/5}
  .buku-kotak{margin:0 12px}
  .r-alat,.r-cari,.r-kaki{padding-left:12px;padding-right:12px}
  .r-kepala{padding-left:14px}
}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;
  background:var(--tinta);color:var(--kertas);padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.ok{background:var(--masuk);color:#fff}
:root[data-theme="dark"] .toast.ok{color:#06281b}
.toast.gagal{background:var(--bahaya);color:#fff}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ================= Utilitas ================= */
var $=function(s,r){return (r||document).querySelector(s);};
var pad=function(n){return String(n).padStart(2,'0');};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(n){return Number(n).toLocaleString('id-ID');};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var bulat=function(s){s=String(s==null?'':s).trim();return /^\d+$/.test(s)?parseInt(s,10):NaN;};
var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowYM(){return todayISO().slice(0,7);}
function fmtTgl(iso){var p=iso.split('-').map(Number);return p[2]+' '+BLN[p[1]-1]+' '+p[0];}
function labelBulan(ym){var p=ym.split('-').map(Number);return BULAN[p[1]-1]+' '+p[0];}
function geserBulan(ym,delta){var p=ym.split('-').map(Number),y=p[0],m=p[1]+delta;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+pad(m);}
function hariLalu(n){var d=new Date();d.setDate(d.getDate()-n);var iso=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());var awal=nowYM()+'-01';return iso<awal?awal:iso;}

/* ================= Penyimpanan ================= */
var KEY='tokoanda:data:v1',PINKEY='tokoanda:pin:v1',SESI='tokoanda:sesi';
var storageOK=true,memori={},sesiMem=false;
(function(){try{localStorage.setItem('tokoanda:uji','1');localStorage.removeItem('tokoanda:uji');}catch(e){storageOK=false;}})();
function sGet(k){try{return localStorage.getItem(k);}catch(e){storageOK=false;return Object.prototype.hasOwnProperty.call(memori,k)?memori[k]:null;}}
function sSet(k,v){try{localStorage.setItem(k,v);}catch(e){storageOK=false;memori[k]=v;}}
function sDel(k){try{localStorage.removeItem(k);}catch(e){storageOK=false;}delete memori[k];}
function sesiAktif(){try{return sessionStorage.getItem(SESI)==='1';}catch(e){return sesiMem;}}
function setSesi(v){sesiMem=v;try{if(v)sessionStorage.setItem(SESI,'1');else sessionStorage.removeItem(SESI);}catch(e){}}

var data=muatLokal();
function muatLokal(){
  var raw=sGet(KEY);
  if(raw){try{var d=JSON.parse(raw);if(d&&Array.isArray(d.items)&&Array.isArray(d.moves))return d;}catch(e){}}
  return {items:[],moves:[]};
}
function simpanLokal(){sSet(KEY,JSON.stringify(data));}

/* ---- Penyimpanan bersama (cloud) ---- */
var awan=null,modeAwan=false,awanMasukItems=false,awanMasukMoves=false;
function awanSiap(){return !modeAwan||(awanMasukItems&&awanMasukMoves);}
function bersihkanItem(it){return {nama:it.nama,lokasi:it.lokasi,kode:it.kode||'',stokAwal:it.stokAwal,mulai:it.mulai,dibuat:it.dibuat,dihapus:it.dihapus||null};}
function bersihkanMove(m){return {itemId:m.itemId,tanggal:m.tanggal,qty:m.qty,catatan:m.catatan||'',dibuat:m.dibuat,dihapus:m.dihapus||null};}
function tulisItem(it){
  simpanLokal();
  if(awan)awan.collection('items').doc(it.id).set(bersihkanItem(it)).catch(function(){toast('Tersimpan di perangkat ini, tapi gagal disinkron ke tim.','gagal');});
}
function tulisMove(m){
  simpanLokal();
  if(awan)awan.collection('moves').doc(m.id).set(bersihkanMove(m)).catch(function(){toast('Tersimpan di perangkat ini, tapi gagal disinkron ke tim.','gagal');});
}
function mulaiAwan(){
  if(!(window.claude&&window.claude.use)){mulaiApp();return;}
  window.claude.use('db').then(function(db){
    if(!db){mulaiApp();return;}
    awan=db;modeAwan=true;mulaiApp();
    awan.collection('items').onSnapshot(function(snap){
      data.items=snap.docs.map(function(d){var v=d.data();return {id:d.id,nama:v.nama,lokasi:v.lokasi,kode:v.kode,stokAwal:v.stokAwal,mulai:v.mulai,dibuat:v.dibuat,dihapus:v.dihapus||null};});
      awanMasukItems=true;simpanLokal();segarkan();
    },function(){toast('Gagal tersambung ke data tim. Menampilkan salinan lokal terakhir.','gagal');awanMasukItems=true;segarkan();});
    awan.collection('moves').onSnapshot(function(snap){
      data.moves=snap.docs.map(function(d){var v=d.data();return {id:d.id,itemId:v.itemId,tanggal:v.tanggal,qty:v.qty,catatan:v.catatan,dibuat:v.dibuat,dihapus:v.dihapus||null};});
      awanMasukMoves=true;simpanLokal();segarkan();
    },function(){toast('Gagal tersambung ke data tim. Menampilkan salinan lokal terakhir.','gagal');awanMasukMoves=true;segarkan();});
  }).catch(function(){mulaiApp();});
}

/* ================= Perhitungan stok ================= */
function itemById(id){return data.items.find(function(i){return i.id===id;});}
function movesOf(id,termasukDihapus){return data.moves.filter(function(m){return m.itemId===id&&(termasukDihapus||!m.dihapus);});}
function jumlahQty(ms){return ms.reduce(function(s,m){return s+m.qty;},0);}
function totalOf(it,kecualiId){return it.stokAwal+jumlahQty(movesOf(it.id).filter(function(m){return m.id!==kecualiId;}));}
function awalOf(it,ym){var mulai=ym+'-01';return it.stokAwal+jumlahQty(movesOf(it.id).filter(function(m){return m.tanggal<mulai;}));}
function akhirOf(it,ym){var akhir=ym+'-31';return it.stokAwal+jumlahQty(movesOf(it.id).filter(function(m){return m.tanggal<=akhir;}));}
function urut(a,b){return a.nama.localeCompare(b.nama,'id',{sensitivity:'base',numeric:true});}

/* ================= Toast & dialog ================= */
function toast(pesan,tipe){
  var dlgs=document.querySelectorAll('dialog[open]');
  var host=dlgs.length?dlgs[dlgs.length-1]:document.body;
  document.querySelectorAll('.toast').forEach(function(e){e.remove();});
  var t=document.createElement('div');t.className='toast '+(tipe||'');t.setAttribute('role','status');t.textContent=pesan;host.appendChild(t);
  setTimeout(function(){t.remove();},3400);
}
function bukaDialog(kelas,html,opsi){
  opsi=opsi||{};
  var d=document.createElement('dialog');d.className='dlg '+(kelas||'');
  d.innerHTML='<div class="isi">'+(html||'')+'</div>';
  document.body.appendChild(d);
  d.addEventListener('close',function(){d.remove();if(d._onClose)d._onClose();});
  if(opsi.latar)d.addEventListener('click',function(e){if(e.target===d)d.close();});
  if(d.showModal)d.showModal();else d.setAttribute('open','');
  return d;
}
function fokusPertama(d){var el=d.querySelector('input:not([type=hidden]):not([type=file]),textarea');if(el)el.focus();}
function konfirmasi(o,onYa){
  var d=bukaDialog('konfirm','<div class="konf"><h2>'+esc(o.judul)+'</h2><p>'+o.isi+'</p><div class="f-aksi"><button type="button" class="tombol sekunder" data-aksi="tutup">Batal</button><button type="button" class="tombol '+(o.bahaya?'bahaya':'utama')+'" data-ya>'+esc(o.tombol)+'</button></div></div>');
  d.querySelector('[data-ya]').addEventListener('click',function(){d.close();onYa();});
  d.querySelector('[data-aksi="tutup"]').focus();
}
function dialogTeks(judul,teks,petunjuk){
  var d=bukaDialog('form','<div class="form"><div class="f-kepala"><h2>'+esc(judul)+'</h2><button type="button" class="tutup" data-aksi="tutup" aria-label="Tutup">&times;</button></div>'+
    '<p class="sub">'+esc(petunjuk||'Salin teks di bawah ini dan simpan di tempat yang aman.')+'</p>'+
    '<textarea readonly rows="10" style="width:100%;border-radius:10px;border:1.5px solid var(--garis-tebal);background:var(--permukaan);padding:10px;font-family:monospace;font-size:13px"></textarea>'+
    '<div class="f-aksi"><button type="button" class="tombol sekunder" data-aksi="tutup">Tutup</button><button type="button" class="tombol utama" data-salin>Salin semua</button></div></div>');
  var ta=d.querySelector('textarea');ta.value=teks;
  d.querySelector('[data-salin]').addEventListener('click',function(){
    var ok=function(){toast('Teks disalin.','ok');};
    var cadangan=function(){try{ta.focus();ta.select();document.execCommand('copy');ok();}catch(e){toast('Salin manual dengan menekan Ctrl+C.','gagal');}};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(teks).then(ok,cadangan);}else cadangan();
  });
}
async function simpanBerkas(nama,isi,judulCadangan){
  try{
    var dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:nama,data:isi});return;}
  }catch(e){if(e&&e.code==='declined')return;}
  dialogTeks(judulCadangan,isi);
}

/* ================= Kotak PIN ================= */
async function hashPin(pin){
  var garam='tokoanda:'+pin;
  try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(garam));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
  catch(e){return 'x'+btoa(garam);}
}
function buatKotakPin(host,onSelesai){
  var html='';for(var i=0;i<4;i++)html+='<input class="pin-kotak" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder=" " autocomplete="off" aria-label="Angka PIN ke-'+(i+1)+'">';
  host.innerHTML='<div class="pin" role="group" aria-label="PIN 4 angka">'+html+'</div>';
  var ins=Array.prototype.slice.call(host.querySelectorAll('input'));
  var nilai=function(){return ins.map(function(x){return x.value;}).join('');};
  ins.forEach(function(inp,i){
    inp.addEventListener('input',function(){
      inp.value=inp.value.replace(/\D/g,'').slice(-1);
      if(inp.value&&i<3)ins[i+1].focus();
      if(nilai().length===4)onSelesai(nilai());
    });
    inp.addEventListener('keydown',function(e){
      if(e.key==='Backspace'&&!inp.value&&i>0){ins[i-1].value='';ins[i-1].focus();e.preventDefault();}
      if(e.key==='ArrowLeft'&&i>0)ins[i-1].focus();
      if(e.key==='ArrowRight'&&i<3)ins[i+1].focus();
    });
    inp.addEventListener('paste',function(e){
      var t=((e.clipboardData||window.clipboardData).getData('text')||'').replace(/\D/g,'').slice(0,4);
      if(!t)return;e.preventDefault();
      ins.forEach(function(x,j){x.value=t[j]||'';});
      ins[Math.min(t.length,3)].focus();
      if(t.length===4)onSelesai(t);
    });
    inp.addEventListener('focus',function(){inp.select();});
  });
  return {
    reset:function(){ins.forEach(function(x){x.value='';});ins[0].focus();},
    fokus:function(){ins[0].focus();},
    salah:function(){var p=host.firstChild;p.classList.add('salah');setTimeout(function(){p.classList.remove('salah');},500);}
  };
}

/* ================= Layar masuk / buat PIN ================= */
var IKON='<svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 10l12-6 12 6v12l-12 6-12-6z" fill="#A6192E"/><path d="M4 10l12 6 12-6M16 16v12" stroke="#14283D" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>';
function tampilBuatPin(){
  var pertama=null,pesan='';
  var gambar=function(){
    $('#app').innerHTML='<div class="masuk-layar"><div class="kartu-masuk"><div class="merek-besar">'+IKON+'<h1 style="font-size:inherit;letter-spacing:inherit">TOKO ANDA</h1></div>'+
      '<p class="sub">'+(pertama?'Ulangi PIN untuk memastikan.':'Selamat datang. Buat PIN 4 angka untuk mengunci aplikasi ini.')+'</p>'+
      '<div class="pin-host" id="pin-host"></div><p class="pesan-pin" id="pesan-pin" role="alert">'+esc(pesan)+'</p></div></div>';
    var kotak=buatKotakPin($('#pin-host'),async function(p){
      if(!pertama){pertama=p;pesan='';gambar();return;}
      if(p!==pertama){pertama=null;pesan='PIN tidak sama. Ulangi dari awal.';kotak.salah();setTimeout(gambar,450);return;}
      sSet(PINKEY,await hashPin(p));setSesi(true);renderMain();
    });
    kotak.fokus();
  };
  gambar();
}
function tampilMasuk(){
  var tersimpan=sGet(PINKEY);
  if(!tersimpan){tampilBuatPin();return;}
  $('#app').innerHTML='<div class="masuk-layar"><div class="kartu-masuk"><div class="merek-besar">'+IKON+'<h1 style="font-size:inherit;letter-spacing:inherit">TOKO ANDA</h1></div>'+
    '<p class="sub">Sistem stok barang. Masukkan PIN untuk melanjutkan.</p>'+
    '<div class="pin-host" id="pin-host"></div><p class="pesan-pin" id="pesan-pin" role="alert"></p>'+
    '<button type="button" class="btn-teks lupa" data-aksi="lupa-pin">Lupa PIN?</button></div></div>';
  var kotak=buatKotakPin($('#pin-host'),async function(p){
    if(await hashPin(p)===tersimpan){setSesi(true);renderMain();}
    else{$('#pesan-pin').textContent='PIN salah. Coba lagi.';kotak.salah();setTimeout(function(){kotak.reset();},350);}
  });
  kotak.fokus();
}

function renderDaftar(){
  var host=$('#daftar');if(!host)return;
  var ym=nowYM();
  $('#sub-bulan').innerHTML='Jumlah dihitung dalam dos. Stok awal dihitung dari awal <b>'+labelBulan(ym)+'</b>.';
  var elSinkron=$('#sub-sinkron');
  if(elSinkron)elSinkron.innerHTML=modeAwan?'&#9679; Tersambung &mdash; data disinkron dengan tim Anda':'&#9675; Tersimpan lokal di perangkat ini saja';
  var q=($('#cari').value||'').trim().toLowerCase();
  if(modeAwan&&!awanSiap()){
    host.innerHTML='<div class="kosong"><h2>Menyambungkan&hellip;</h2><p class="sub">Mengambil data stok terbaru dari server.</p></div>';
    return;
  }
  var semua=data.items.filter(function(i){return !i.dihapus;}).sort(urut);
  var hasil=q?semua.filter(function(i){return (i.nama+' '+i.lokasi+' '+i.kode).toLowerCase().indexOf(q)>=0;}):semua;
  $('#jumlah').textContent=q?(hasil.length+' dari '+semua.length+' barang'):(semua.length+' barang');
  if(!semua.length){
    host.innerHTML='<div class="kosong"><h2>Belum ada barang</h2><p class="sub">Tambahkan barang pertama Anda, atau isi data contoh untuk mencoba semua fitur.</p>'+
      '<div class="aksi-utama"><button type="button" class="tombol utama" data-aksi="barang-baru">+ Barang baru</button><button type="button" class="tombol sekunder" data-aksi="contoh">Isi data contoh</button></div></div>';
    return;
  }
  if(!hasil.length){host.innerHTML='<div class="kosong"><h2>Tidak ditemukan</h2><p class="sub">Tidak ada barang yang cocok dengan &ldquo;'+esc($('#cari').value.trim())+'&rdquo;.</p></div>';return;}
  var baris=hasil.map(function(it){
    var n=esc(it.nama);
    return '<tr><td data-label="Nama Barang"><span class="nama">'+n+'</span>'+(it.kode?'<span class="kode">Kode '+esc(it.kode)+'</span>':'')+'</td>'+
      '<td data-label="Lokasi">'+(it.lokasi?esc(it.lokasi):'-')+'</td>'+
      '<td class="angka" data-label="Stok Awal">'+fmt(awalOf(it,ym))+'</td>'+
      '<td class="angka total" data-label="Total Stok">'+fmt(totalOf(it))+'</td>'+
      '<td class="aksi-sel"><button type="button" class="btn-sel" data-aksi="buka" data-id="'+it.id+'" aria-label="Buka rincian '+n+'">Buka</button></td>'+
      '<td class="aksi-sel"><button type="button" class="btn-sel plus" data-aksi="tambah" data-id="'+it.id+'" aria-label="Tambah catatan stok '+n+'">+</button></td>'+
      '<td class="aksi-sel"><button type="button" class="btn-sel hapus" data-aksi="hapus-barang" data-id="'+it.id+'" aria-label="Hapus '+n+'">Hapus</button></td></tr>';
  }).join('');
  host.innerHTML='<div class="tabel-bungkus"><table class="tabel"><thead><tr><th>Nama Barang</th><th>Lokasi</th><th class="angka">Stok Awal</th><th class="angka">Total Stok</th><th>Rincian</th><th>Tambah</th><th>Hapus</th></tr></thead><tbody>'+baris+'</tbody></table></div>';
}

/* ================= Form barang (baru / edit) ================= */
function formBarang(id,awal){
  var it=id?itemById(id):null;awal=awal||{};
  var html='<form class="form" novalidate><div class="f-kepala"><div><h2>'+(it?'Edit barang':'Barang baru')+'</h2><p class="sub">Info barang</p></div><button type="button" class="tutup" data-aksi="tutup" aria-label="Tutup">&times;</button></div>'+
    '<label>Nama Barang<input name="nama" maxlength="80" autocomplete="off" value="'+esc(it?it.nama:'')+'"></label>'+
    '<label>Lokasi<input name="lokasi" maxlength="60" autocomplete="off" placeholder="mis. Rak A2 atau Gudang belakang" value="'+esc(it?it.lokasi:'')+'"></label>'+
    '<label>Kode barang <small>Opsional. Pindai barcode atau ketik manual. Dipakai untuk mencatat stok lewat pemindai.</small><input name="kode" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+esc(it?it.kode:(awal.kode||''))+'"></label>'+
    '<label>Stok Awal <small>Jumlah dos pada awal bulan</small><input name="stokAwal" type="number" min="0" step="1" inputmode="numeric" value="'+(it?it.stokAwal:'')+'"></label>'+
    '<p class="galat" role="alert" hidden></p>'+
    '<div class="f-aksi"><button type="button" class="tombol sekunder" data-aksi="tutup">Batal</button><button type="submit" class="tombol utama">Simpan</button></div></form>';
  var d=bukaDialog('form',html);
  var form=d.querySelector('form'),g=d.querySelector('.galat');
  fokusPertama(d);
  form.elements.kode.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();form.elements.stokAwal.focus();}});
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var f=form.elements;
    var nama=f.nama.value.trim(),lokasi=f.lokasi.value.trim(),kode=f.kode.value.trim(),awalN=bulat(f.stokAwal.value);
    var galat=function(p,nm){g.textContent=p;g.hidden=false;if(nm)f[nm].focus();};
    var selfId=it?it.id:null;
    if(!nama)return galat('Nama barang wajib diisi.','nama');
    if(data.items.some(function(i){return !i.dihapus&&i.id!==selfId&&i.nama.toLowerCase()===nama.toLowerCase();}))return galat('Barang dengan nama ini sudah ada.','nama');
    if(kode){var dup=data.items.find(function(i){return !i.dihapus&&i.id!==selfId&&i.kode&&i.kode.toLowerCase()===kode.toLowerCase();});if(dup)return galat('Kode ini sudah dipakai oleh "'+dup.nama+'".','kode');}
    if(isNaN(awalN))return galat('Stok awal harus berupa angka bulat 0 atau lebih.','stokAwal');
    if(it){var total=awalN+jumlahQty(movesOf(it.id));if(total<0)return galat('Stok awal terlalu kecil: catatan stok keluar akan membuat total menjadi '+total+'.','stokAwal');}
    var editing=!!it;
    if(it){it.nama=nama;it.lokasi=lokasi;it.kode=kode;it.stokAwal=awalN;}
    else{it={id:uid(),nama:nama,lokasi:lokasi,kode:kode,stokAwal:awalN,mulai:nowYM(),dibuat:Date.now(),dihapus:null};data.items.push(it);}
    tulisItem(it);d.close();segarkan();
    toast(editing?'Perubahan disimpan.':'Barang "'+nama+'" ditambahkan.','ok');
  });
}

/* ================= Form catatan stok (masuk / keluar) ================= */
function formStok(itemId,moveId){
  var it=itemById(itemId);if(!it)return;
  var mv=moveId?data.moves.find(function(m){return m.id===moveId;}):null;
  var hariIni=todayISO();
  var html='<form class="form" novalidate><div class="f-kepala"><div><h2>'+esc(it.nama)+'</h2><p class="sub">'+(mv?'Edit catatan stok. ':'Catat stok. ')+'Total stok saat ini <b>'+fmt(totalOf(it))+'</b> dos.</p></div><button type="button" class="tutup" data-aksi="tutup" aria-label="Tutup">&times;</button></div>'+
    '<label>Tanggal<input type="date" name="tanggal" min="'+it.mulai+'-01" max="'+hariIni+'" value="'+(mv?mv.tanggal:hariIni)+'"></label>'+
    '<div class="dua"><label class="f-masuk">Stok Masuk (+)<input type="number" name="masuk" min="1" step="1" inputmode="numeric" placeholder="0" value="'+(mv&&mv.qty>0?mv.qty:'')+'"></label>'+
    '<label class="f-keluar">Stok Keluar (&minus;)<input type="number" name="keluar" min="1" step="1" inputmode="numeric" placeholder="0" value="'+(mv&&mv.qty<0?-mv.qty:'')+'"></label></div>'+
    '<p class="petunjuk">Isi salah satu. Jumlah dihitung dalam dos yang dibuka.</p>'+
    '<label>Catatan<textarea name="catatan" rows="3" maxlength="200" placeholder="mis. Restok dari agen, terjual grosir">'+esc(mv?mv.catatan:'')+'</textarea></label>'+
    '<p class="galat" role="alert" hidden></p>'+
    '<div class="f-aksi"><button type="button" class="tombol sekunder" data-aksi="tutup">Batal</button><button type="submit" class="tombol utama">Selesai</button></div></form>';
  var d=bukaDialog('form',html);
  var form=d.querySelector('form'),g=d.querySelector('.galat'),f=form.elements;
  fokusPertama(d);
  f.masuk.addEventListener('input',function(){if(f.masuk.value)f.keluar.value='';});
  f.keluar.addEventListener('input',function(){if(f.keluar.value)f.masuk.value='';});
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var galat=function(p,nm){g.textContent=p;g.hidden=false;if(nm)f[nm].focus();};
    var tgl=f.tanggal.value;
    if(!tgl)return galat('Tanggal wajib diisi.','tanggal');
    if(tgl>hariIni)return galat('Tanggal tidak boleh di masa depan.','tanggal');
    if(tgl<it.mulai+'-01')return galat('Tanggal tidak boleh sebelum awal '+labelBulan(it.mulai)+', bulan pertama barang ini dicatat.','tanggal');
    var m=f.masuk.value.trim(),k=f.keluar.value.trim();
    if(m&&k)return galat('Isi salah satu saja: Stok Masuk atau Stok Keluar. Untuk keduanya, buat dua catatan.','masuk');
    if(!m&&!k)return galat('Isi Stok Masuk atau Stok Keluar.','masuk');
    var angka=bulat(m||k);
    if(isNaN(angka)||angka<1)return galat('Jumlah harus berupa angka bulat lebih dari 0.',m?'masuk':'keluar');
    var qty=m?angka:-angka;
    var dasar=totalOf(it,mv?mv.id:null);
    if(dasar+qty<0)return galat('Stok keluar melebihi total stok. Tersisa '+fmt(dasar)+' dos.','keluar');
    var cat=f.catatan.value.trim();
    if(mv){mv.tanggal=tgl;mv.qty=qty;mv.catatan=cat;}
    else{mv={id:uid(),itemId:it.id,tanggal:tgl,qty:qty,catatan:cat,dibuat:Date.now(),dihapus:null};data.moves.push(mv);}
    tulisMove(mv);d.close();segarkan();
    toast(mv?'Catatan diperbarui.':'Tersimpan: '+(qty>0?'+':'\u2212')+fmt(Math.abs(qty))+' dos '+it.nama+'.','ok');
  });
}

        var mm=raw.match(/^([+\-\u2212\u2013])\s*(\d+)$/);
        if(!mm||parseInt(mm[2],10)<1)return galat('Setelah tanda, isi angka bulat lebih dari 0. Contoh: +12');

        S.langkah='kode';S.item=null;S.galat='';gambar();segarkan();
      });
      inp.focus();
    }
  }
  gambar();
}

function csvBulanIni(){
  var ym=nowYM();
  var sel=function(c){if(typeof c==='number')return String(c);var s=String(c==null?'':c);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};
  var baris=[['Nama Barang','Kode','Lokasi','Stok Awal '+labelBulan(ym),'Stok Masuk','Stok Keluar','Total Stok']];
  data.items.filter(function(i){return !i.dihapus;}).sort(urut).forEach(function(it){
    var ms=movesOf(it.id).filter(function(m){return m.tanggal.slice(0,7)===ym;});
    var masuk=jumlahQty(ms.filter(function(m){return m.qty>0;}));
    var keluar=-jumlahQty(ms.filter(function(m){return m.qty<0;}));
    baris.push([it.nama,it.kode,it.lokasi,awalOf(it,ym),masuk,keluar,totalOf(it)]);
  });
  return '\uFEFF'+baris.map(function(r){return r.map(sel).join(';');}).join('\r\n');
}

function pulihkanDari(teks){
  var o;

  var ok=o&&Array.isArray(o.items)&&Array.isArray(o.moves)&&o.items.every(function(i){return i&&typeof i.id==='string'&&typeof i.nama==='string'&&Number.isInteger(i.stokAwal)&&i.stokAwal>=0&&/^\d{4}-\d{2}$/.test(i.mulai||'');});
  if(ok){var ids={};o.items.forEach(function(i){ids[i.id]=1;});ok=o.moves.every(function(m){return m&&typeof m.id==='string'&&ids[m.itemId]&&/^\d{4}-\d{2}-\d{2}$/.test(m.tanggal||'')&&Number.isInteger(m.qty)&&m.qty!==0;});}
  if(!ok){toast('File bukan cadangan TOKO ANDA yang valid.','gagal');return;}
  var cakupan=modeAwan?' Ini akan mengganti data yang dilihat seluruh tim yang tersambung.':'';
  konfirmasi({judul:'Pulihkan cadangan?',isi:'Cadangan berisi <b>'+o.items.filter(function(i){return !i.dihapus;}).length+' barang</b>. Data yang ada sekarang akan diganti seluruhnya.'+cakupan,tombol:'Pulihkan',bahaya:true},function(){
    var lamaItems=data.items,lamaMoves=data.moves;
    var baruItems=o.items.map(function(i){return {id:i.id,nama:String(i.nama).slice(0,80),lokasi:String(i.lokasi||'').slice(0,60),kode:String(i.kode||'').slice(0,40),stokAwal:i.stokAwal,mulai:i.mulai,dibuat:Number(i.dibuat)||Date.now(),dihapus:i.dihapus?(Number(i.dihapus)||Date.now()):null};});
    var baruMoves=o.moves.map(function(m){return {id:m.id,itemId:m.itemId,tanggal:m.tanggal,qty:m.qty,catatan:String(m.catatan||'').slice(0,200),dibuat:Number(m.dibuat)||Date.now(),dihapus:m.dihapus?(Number(m.dihapus)||Date.now()):null};});
    data={items:baruItems,moves:baruMoves};
    simpanLokal();
    document.querySelectorAll('dialog').forEach(function(x){x.close();});
    segarkan();toast('Cadangan berhasil dipulihkan.','ok');
    if(awan){
      var idBaruI={};baruItems.forEach(function(i){idBaruI[i.id]=1;});
      var idBaruM={};baruMoves.forEach(function(m){idBaruM[m.id]=1;});
      lamaItems.filter(function(i){return !idBaruI[i.id]&&!i.dihapus;}).forEach(function(i){awan.collection('items').doc(i.id).set(bersihkanItem({nama:i.nama,lokasi:i.lokasi,kode:i.kode,stokAwal:i.stokAwal,mulai:i.mulai,dibuat:i.dibuat,dihapus:Date.now()})).catch(function(){});});
      lamaMoves.filter(function(m){return !idBaruM[m.id]&&!m.dihapus;}).forEach(function(m){awan.collection('moves').doc(m.id).set(bersihkanMove({itemId:m.itemId,tanggal:m.tanggal,qty:m.qty,catatan:m.catatan,dibuat:m.dibuat,dihapus:Date.now()})).catch(function(){});});
      baruItems.forEach(function(i){awan.collection('items').doc(i.id).set(bersihkanItem(i)).catch(function(){});});
      baruMoves.forEach(function(m){awan.collection('moves').doc(m.id).set(bersihkanMove(m)).catch(function(){});});
    }
  });
}

  keluar:function(){setSesi(false);document.querySelectorAll('dialog').forEach(function(x){x.close();});tampilMasuk();},
  'lupa-pin':function(){
    konfirmasi({judul:'Buat PIN baru?',isi:'PIN saat ini akan diganti dengan yang baru. Data stok <b>tidak akan terhapus</b>'+(modeAwan?' &mdash; data tetap tersimpan untuk tim Anda.':' &mdash; data tetap tersimpan di perangkat ini.'),tombol:'Buat PIN baru'},function(){
      sDel(PINKEY);setSesi(false);tampilBuatPin();
    });
  },
  'barang-baru':function(){formBarang();},
  pindai:function(){dialogPindai();},
  contoh:function(){isiContoh();},
  cadangan:function(){dialogPengaturan();},
  buka:function(el){bukaRincian(el.dataset.id);},
  tambah:function(el){formStok(el.dataset.id);},
  'hapus-barang':function(el){
    var it=itemById(el.dataset.id);if(!it)return;
    konfirmasi({judul:'Hapus "'+it.nama+'"?',isi:'Barang disembunyikan dari daftar. Catatan stoknya tetap tersimpan, dan barang bisa dipulihkan lewat Cadangan &amp; pengaturan.',tombol:'Hapus',bahaya:true},function(){
      it.dihapus=Date.now();tulisItem(it);segarkan();toast('"'+it.nama+'" dihapus.');
    });
  },
  'bulan-prev':function(){if(!rincian)return;var it=itemById(rincian.itemId);if(rincian.ym>it.mulai){rincian.ym=geserBulan(rincian.ym,-1);renderRincian();}},
  'bulan-next':function(){if(!rincian)return;if(rincian.ym<nowYM()){rincian.ym=geserBulan(rincian.ym,1);renderRincian();}},
  catat:function(){if(rincian)formStok(rincian.itemId);},
  'edit-catatan':function(el){if(rincian)formStok(rincian.itemId,el.dataset.id);},
  'hapus-catatan':function(el){
    var m=data.moves.find(function(x){return x.id===el.dataset.id;});if(!m)return;
    var it=itemById(m.itemId);
    if(m.qty>0&&totalOf(it,m.id)<0){toast('Tidak bisa dihapus: total stok akan menjadi negatif.','gagal');return;}
    konfirmasi({judul:'Hapus catatan ini?',isi:'Catatan <b>'+(m.qty>0?'+':'\u2212')+fmt(Math.abs(m.qty))+'</b> pada '+fmtTgl(m.tanggal)+' akan disembunyikan dan tidak dihitung dalam total. Anda bisa memulihkannya lagi.',tombol:'Hapus',bahaya:true},function(){
      m.dihapus=Date.now();tulisMove(m);segarkan();toast('Catatan dihapus.');
    });
  },
  'pulihkan-catatan':function(el){
    var m=data.moves.find(function(x){return x.id===el.dataset.id;});if(!m)return;
    var it=itemById(m.itemId);
    if(totalOf(it)+m.qty<0){toast('Tidak bisa dipulihkan: total stok akan menjadi negatif.','gagal');return;}
    m.dihapus=null;tulisMove(m);segarkan();toast('Catatan dipulihkan.','ok');
  },
  'pulihkan-barang':function(el){
    var it=itemById(el.dataset.id);if(!it)return;
    if(data.items.some(function(i){return !i.dihapus&&i.id!==it.id&&i.nama.toLowerCase()===it.nama.toLowerCase();})){toast('Sudah ada barang aktif dengan nama yang sama.','gagal');return;}
    it.dihapus=null;tulisItem(it);segarkan();toast('"'+it.nama+'" dipulihkan.','ok');
    var d=el.closest('dialog');if(d&&d._gambar)d._gambar();
  },
  'unduh-cadangan':function(){simpanBerkas('toko-anda-cadangan-'+todayISO()+'.json',isiCadangan(),'Cadangan data');},
  'unduh-csv':function(){simpanBerkas('toko-anda-stok-'+nowYM()+'.csv',csvBulanIni(),'Stok bulan ini (CSV)');},
  'pulihkan-tempel':function(el){var ta=el.closest('dialog').querySelector('#tempel');if(!ta.value.trim()){toast('Tempel isi cadangan terlebih dahulu.','gagal');return;}pulihkanDari(ta.value);},
  'ganti-pin':function(){dialogGantiPin();}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-aksi]');
  if(!el||el.disabled)return;
  var fn=AKSI[el.dataset.aksi];if(fn)fn(el,e);
});

/* ================= Mulai ================= */
function mulaiApp(){
  if(!sGet(PINKEY))tampilBuatPin();
  else if(sesiAktif())renderMain();
  else tampilMasuk();
}
mulaiAwan();
})();
</script>
</body>
</html>
